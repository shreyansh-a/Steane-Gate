[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steane-gate"
version = "0.1.0"
description = "A package for creating quantum circuits using encoded Steane blocks and transversal Clifford logic."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shreyansh Agrawal" }]
dependencies = [
    "numpy>=1.24",
    "stim>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]
